<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Tarjeta de presentación: Delivery Playazo, sucursal Boca del Río. Versión v1.0 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0891b2">
<meta name="color-scheme" content="light">
<title>Delivery Playazo v1.0</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏖️%3C/text%3E%3C/svg%3E">
<style>
:root{
  --mar:#0891b2; --mar-osc:#0e7490; --marino:#10223d; --sol:#facc15; --sol-osc:#dca900;
  --palma:#15803d; --palma-osc:#166534; --arena:#f4f6f8; --tinta:#475569;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#cfe3ea;color:var(--marino);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.tarjeta{max-width:440px;min-height:100vh;margin:0 auto;background:var(--arena);overflow:hidden;box-shadow:0 0 40px rgba(16,34,61,.18)}

.cabecera{position:relative;padding:calc(30px + env(safe-area-inset-top)) 22px 78px;text-align:center;color:#fff;
  background:radial-gradient(circle at 88% 6%,rgba(250,204,21,.45) 0,rgba(250,204,21,0) 38%),linear-gradient(165deg,#12a8c9 0,var(--mar) 55%,var(--mar-osc) 100%)}
.cabecera h1{margin:0;font-size:clamp(2rem,9.5vw,2.6rem);font-weight:800;letter-spacing:-.02em;line-height:1.05;text-shadow:0 2px 0 rgba(14,116,144,.55)}
.cabecera p{margin:10px auto 0;max-width:19em;font-size:1.0625rem;line-height:1.35;color:#e6f7fb}
.ola{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:34px;display:block}

.portada{position:relative;margin:-54px 16px 0;border-radius:22px;overflow:hidden;background:#fff;line-height:0;
  box-shadow:0 12px 28px rgba(0,40,90,.24);animation:entra .7s cubic-bezier(.2,.7,.2,1) both}
.portada img{display:block;width:100%;height:auto}

.lugar{display:flex;align-items:center;gap:14px;margin:16px 16px 0;padding:14px 16px;background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,40,90,.08)}
.lugar .ico{flex:0 0 46px;width:46px;height:46px;border-radius:50%;background:#e0f2fe;color:#0369a1;display:flex;align-items:center;justify-content:center}
.lugar strong{display:block;font-size:1.0625rem;font-weight:800;line-height:1.2}
.lugar span{display:block;margin-top:2px;font-size:.9375rem;color:var(--tinta)}

.acciones{display:grid;gap:14px;padding:20px 16px 8px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:30px;
  font-size:1.0625rem;font-weight:800;text-decoration:none;color:#fff;background:var(--bg);
  box-shadow:0 4px 0 var(--sh);transition:transform .1s ease,box-shadow .1s ease;-webkit-tap-highlight-color:transparent}
.btn svg{flex:0 0 auto;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.btn:focus-visible{outline:3px solid var(--marino);outline-offset:3px}
.btn.pedir{--bg:var(--sol);--sh:var(--sol-osc);color:var(--marino);min-height:64px;font-size:1.1875rem}
.btn.mapa{--bg:var(--mar);--sh:var(--mar-osc)}
.btn.wa{--bg:var(--palma);--sh:var(--palma-osc)}
.btn.tel{--bg:#fff;--sh:#cbd5e1;color:var(--marino);border:2px solid #cbd5e1;min-height:56px}
@media (hover:hover){.btn:hover{filter:brightness(1.05)}}

.pie{padding:14px 16px calc(26px + env(safe-area-inset-bottom));text-align:center;font-size:.8125rem;color:#64748b}
noscript{display:block;padding:24px;text-align:center}

@keyframes entra{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.portada{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<main class="tarjeta">
  <header class="cabecera">
    <h1 id="nombre"></h1>
    <p id="rubro"></p>
    <svg class="ola" viewBox="0 0 440 34" preserveAspectRatio="none" aria-hidden="true"><path d="M0 18c55 20 110 20 165 6s110-24 170-10c40 9 75 12 105 6v14H0z" fill="#f4f6f8"/></svg>
  </header>

  <div class="portada">
    <img src="portada-playazo-v1.5.jpg" width="1024" height="480" alt="Portada de Delivery Playazo con playa tropical y helados Yámboly">
  </div>

  <section class="lugar" aria-label="Ubicación de la sucursal">
    <div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></div>
    <div>
      <strong id="sucursal"></strong>
      <span id="lugar"></span>
    </div>
  </section>

  <nav class="acciones" aria-label="Opciones">
    <a class="btn pedir" id="btnPedir" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
      Pedir delivery en la playa
    </a>
    <a class="btn mapa" id="btnMapa" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
      Cómo llegar
    </a>
    <a class="btn wa" id="btnWa" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
      Escribir por WhatsApp
    </a>
    <a class="btn tel" id="btnTel" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      Llamar
    </a>
  </nav>

  <footer class="pie" id="pie"></footer>
  <noscript>Activa JavaScript para ver esta tarjeta.</noscript>
</main>

<script>
// Datos de la tarjeta: aquí se cambia todo (nombre, enlaces, número).
const VERSION = "v1.0";
const CONFIG = {
  nombre: "Delivery Playazo",
  rubro: "Delivery de bebidas, helados y piqueos en la playa",
  sucursal: "Sucursal Boca del Río",
  lugar: "Playa Boca del Río, Tacna",
  telefono: "959434743",
  mensajeWA: "Hola, quiero información de Delivery Playazo.",
  linkMapa: "https://maps.app.goo.gl/ZsAQH34VPZLV7Jeb8?g_st=ac",
  linkTienda: "https://nnilton501peru.github.io/delivery.Playazo/"
};

document.title = CONFIG.nombre + " " + VERSION;
document.getElementById("nombre").textContent = CONFIG.nombre;
document.getElementById("rubro").textContent = CONFIG.rubro;
document.getElementById("sucursal").textContent = CONFIG.sucursal;
document.getElementById("lugar").textContent = CONFIG.lugar;
document.getElementById("btnPedir").href = CONFIG.linkTienda;
document.getElementById("btnMapa").href = CONFIG.linkMapa;
document.getElementById("btnWa").href = "https://wa.me/51" + CONFIG.telefono + "?text=" + encodeURIComponent(CONFIG.mensajeWA);
document.getElementById("btnTel").href = "tel:+51" + CONFIG.telefono;
document.getElementById("pie").textContent = CONFIG.nombre + ", tarjeta " + VERSION;
</script>
</body>
</html>
