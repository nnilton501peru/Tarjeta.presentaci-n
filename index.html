<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Delivery Playazo v2.3: ajuste de encabezado y categorías; se conserva la portada original -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0797b8">
<meta name="color-scheme" content="light">
<title>Delivery Playazo v2.3</title>
<style>
:root{
  --mar:#0797b8; --mar-osc:#087a99; --marino:#10264a;
  --sol:#ffca05; --sol-osc:#d9a800; --verde:#079b55;
  --arena:#f1f8fc; --tinta:#53657f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:#d8edf5;color:var(--marino);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.pagina{width:100%;max-width:620px;min-height:100vh;margin:0 auto;background:var(--arena);overflow:hidden;box-shadow:0 0 34px rgba(16,38,74,.16)}
.cabecera{padding:20px 14px 16px;text-align:center;color:#fff;background:linear-gradient(135deg,#087eb5,#10b9d0 58%,#36b98d)}
.marca-secundaria{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;font-size:clamp(2rem,8vw,2.65rem);font-weight:950;line-height:1.02;letter-spacing:-.045em;color:#fff;text-shadow:0 3px 0 #07518b,0 5px 12px rgba(0,45,85,.24)}
.subtitulo{margin:9px auto 0;max-width:28rem;font-family:"Trebuchet MS",system-ui,sans-serif;font-size:clamp(1.25rem,5vw,1.65rem);line-height:1.15;font-weight:900;font-style:italic;letter-spacing:-.025em;color:#fff5a8;text-shadow:0 2px 0 #07518b,0 3px 8px rgba(0,45,85,.25)}
.categorias{margin:13px auto 0;max-width:34rem;padding:9px 10px;border-radius:24px;background:#073f83;border:2px solid rgba(255,255,255,.85);color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif;font-size:clamp(.84rem,3.2vw,1.02rem);font-weight:850;line-height:1.5;box-shadow:0 3px 0 rgba(4,48,100,.22)}
.categorias span{color:#ffe45b}
.portada{margin:0;background:#fff;line-height:0}
.portada img{display:block;width:100%;height:auto;object-fit:cover}
.lugar{display:flex;align-items:center;gap:14px;margin:18px 16px 0;padding:17px 18px;background:#fff;border-radius:22px;box-shadow:0 5px 18px rgba(16,38,74,.09)}
.ubicacion-ico{flex:0 0 58px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#dff4ff;color:#087da8}
.ubicacion-ico svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lugar strong{display:block;font-size:1.08rem;font-weight:850;line-height:1.25}
.lugar span{display:block;margin-top:4px;color:var(--tinta);font-size:.98rem;line-height:1.3}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px 16px 10px}
.btn{min-height:62px;padding:12px 14px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:32px;text-align:center;text-decoration:none;font-size:1rem;font-weight:850;line-height:1.15;box-shadow:0 4px 0 var(--sombra);transition:transform .1s ease; -webkit-tap-highlight-color:transparent}
.btn svg{width:23px;height:23px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sombra)}
.btn.pedir{grid-column:1/-1;min-height:72px;background:var(--sol);--sombra:var(--sol-osc);color:var(--marino);font-size:1.22rem}
.btn.mapa{background:var(--mar);--sombra:var(--mar-osc);color:#fff}
.btn.wa{background:var(--verde);--sombra:#087842;color:#fff}
.btn.tel{grid-column:1/-1;background:#fff;--sombra:#c9e1ef;color:var(--marino);border:2px solid #c9e1ef}
.pie{padding:17px 16px calc(24px + env(safe-area-inset-bottom));text-align:center;background:linear-gradient(#e7f7ff,#d4effb);color:#164477}
.pie strong{display:block;font-size:1.1rem;font-style:italic}
.pie span{display:block;margin-top:6px;font-size:.82rem;letter-spacing:.04em}
@media(min-width:520px){
  .cabecera{padding-top:28px;padding-bottom:22px}
  .lugar{margin-left:22px;margin-right:22px}
  .acciones{padding-left:22px;padding-right:22px;gap:14px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style>
</head>
<body>
<main class="pagina">
  <header class="cabecera">
    <h1 class="marca-secundaria">Delivery Playazo</h1>
    <p class="subtitulo">Antojos frente al mar.</p>
    <p class="categorias"><span>Helados</span> · Bebidas · <span>Snacks</span> · Piqueos de playa · <span>Hielo</span></p>
  </header>

  <section class="portada" aria-label="Helados Yámboly en la playa">
    <img src="portada-playazo-v2.0.jpg" width="1832" height="858"
      alt="Helados Yámboly: paletas de colores, helado de chocolate y vaso de helado en una playa tropical">
  </section>

  <section class="lugar" aria-label="Ubicación de la sucursal">
    <div>
      <strong>Nuestra sucursal</strong>
      <span>Playa Boca del Río, Tacna</span>
    </div>
  </section>

  <nav class="acciones" aria-label="Opciones de contacto y pedido">
    <a class="btn pedir" id="btnPedir" href="https://nnilton501peru.github.io/delivery.Playazo/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h2l2.7 12.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L22 7H5"/></svg>
      Hacer mi pedido <span aria-hidden="true">→</span>
    </a>
    <a class="btn mapa" id="btnMapa" href="https://maps.app.goo.gl/ZsAQH34VPZLV7Jeb8?g_st=ac" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      Ver en el mapa
    </a>
    <a class="btn wa" id="btnWa" href="https://wa.me/51959434743?text=Hola%2C%20quiero%20informaci%C3%B3n%20de%20Delivery%20Playazo." target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-4.7A8.5 8.5 0 1 1 20.5 11.5Z"/><path d="M8 8.2c.3-.6.6-.6 1-.6h.4c.2 0 .4.1.5.4l.8 1.8c.1.2.1.4-.1.6l-.6.7c-.2.2-.2.4 0 .7.5.9 1.3 1.7 2.2 2.2.3.2.5.2.7 0l.8-.9c.2-.2.4-.2.6-.1l1.7.8c.3.1.4.3.4.5 0 .5-.2 1.2-.7 1.6-.5.5-1.2.7-2 .5-1.2-.3-2.6-1-4-2.4-1.4-1.4-2.1-2.8-2.4-4-.2-.7 0-1.4.7-1.8Z"/></svg>
      WhatsApp
    </a>
    <a class="btn tel" id="btnTel" href="tel:+51959434743">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.2 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>
      Llamar
    </a>
  </nav>

  <footer class="pie">
    <strong>Delivery Playazo</strong>
    <span>HELADOS · BEBIDAS · SNACKS · PIQUEOS DE PLAYA · HIELO</span>
    <span>Tarjeta web v2.3</span>
  </footer>
</main>
</body>
</html>
